<!DOCTYPE html>
<html lang="ko">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>withpiano - 곧 만나요!</title>
  <!-- 폰트 불러오기 (Pretendard & Cormorant Garamond) -->
  <link rel="stylesheet" href="https://cdn.jsdelivr.net/gh/orioncactus/pretendard/dist/web/static/pretendard.css">
  <link href="https://fonts.googleapis.com/css2?family=Cormorant+Garamond:wght@400;600&display=swap" rel="stylesheet">
  
  <style>
    :root {
      --bg-color: #121316;
      --card-bg: rgba(25, 27, 32, 0.7);
      --primary-gold: #c5a880;
      --primary-gold-light: #e2c9a8;
      --text-main: #f5f5f7;
      --text-sub: #9ea0a8;
      --border-color: rgba(197, 168, 128, 0.2);
    }

    * {
      margin: 0;
      padding: 0;
      box-sizing: border-box;
      font-family: "Pretendard", -apple-system, BlinkMacSystemFont, system-ui, Roboto, sans-serif;
    }

    body {
      background-color: var(--bg-color);
      color: var(--text-main);
      min-height: 100vh;
      display: flex;
      flex-direction: column;
      justify-content: space-between;
      align-items: center;
      position: relative;
      overflow-x: hidden;
      background-image: 
        radial-gradient(circle at 50% 20%, rgba(197, 168, 128, 0.08) 0%, transparent 60%),
        radial-gradient(circle at 80% 80%, rgba(255, 255, 255, 0.03) 0%, transparent 40%);
    }

    /* 상단 로고 */
    header {
      width: 100%;
      padding: 40px 20px;
      text-align: center;
    }

    .brand-logo {
      font-family: 'Cormorant Garamond', serif;
      font-size: 2.1rem;
      letter-spacing: 3px;
      color: var(--text-main);
      text-transform: lowercase;
      display: inline-block;
    }

    .brand-logo span {
      color: var(--primary-gold);
      font-weight: 600;
    }

    /* 메인 카드 영역 */
    main {
      flex: 1;
      display: flex;
      justify-content: center;
      align-items: center;
      padding: 20px;
      width: 100%;
      max-width: 560px;
    }

    .card {
      background: var(--card-bg);
      backdrop-filter: blur(12px);
      -webkit-backdrop-filter: blur(12px);
      border: 1px solid var(--border-color);
      border-radius: 28px;
      padding: 56px 40px;
      text-align: center;
      box-shadow: 0 20px 40px rgba(0, 0, 0, 0.4);
      width: 100%;
      animation: fadeIn 1s ease-out;
    }

    /* 뱃지 */
    .badge {
      display: inline-flex;
      align-items: center;
      gap: 6px;
      padding: 6px 16px;
      border-radius: 50px;
      background: rgba(197, 168, 128, 0.12);
      border: 1px solid rgba(197, 168, 128, 0.3);
      color: var(--primary-gold-light);
      font-size: 0.85rem;
      font-weight: 500;
      letter-spacing: 1px;
      margin-bottom: 28px;
    }

    .badge-dot {
      width: 6px;
      height: 6px;
      background-color: var(--primary-gold);
      border-radius: 50%;
      animation: pulse 1.8s infinite;
    }

    /* 타이틀 및 텍스트 */
    h1 {
      font-size: 1.9rem;
      font-weight: 700;
      line-height: 1.45;
      margin-bottom: 18px;
      word-break: keep-all;
    }

    h1 .highlight {
      color: var(--primary-gold);
      font-weight: inherit;
    }

    p.description {
      color: var(--text-sub);
      font-size: 1.05rem;
      line-height: 1.7;
      margin-bottom: 40px;
      word-break: keep-all;
    }

    /* 피아노 건반 장식 (CSS) */
    .piano-deco {
      display: flex;
      justify-content: center;
      height: 42px;
      opacity: 0.85;
    }

    .key-white {
      width: 14px;
      height: 42px;
      background: #ededed;
      border: 1px solid #1f2024;
      border-radius: 0 0 2px 2px;
      position: relative;
    }

    .key-black {
      width: 10px;
      height: 25px;
      background: #141517;
      position: absolute;
      right: -5px;
      top: 0;
      z-index: 2;
      border-radius: 0 0 2px 2px;
    }

    /* 하단 푸터 */
    footer {
      width: 100%;
      padding: 36px 20px;
      text-align: center;
      color: #63656d;
      font-size: 0.85rem;
    }

    footer p {
      margin-bottom: 6px;
    }

    /* 애니메이션 */
    @keyframes fadeIn {
      from {
        opacity: 0;
        transform: translateY(18px);
      }
      to {
        opacity: 1;
        transform: translateY(0);
      }
    }

    @keyframes pulse {
      0%, 100% {
        opacity: 1;
        transform: scale(1);
      }
      50% {
        opacity: 0.4;
        transform: scale(0.8);
      }
    }

    @media (max-width: 480px) {
      h1 {
        font-size: 1.55rem;
      }
      p.description {
        font-size: 0.95rem;
      }
      .card {
        padding: 44px 24px;
      }
    }
  </style>
</head>
<body>

  <!-- 상단 로고 -->
  <header>
    <div class="brand-logo">with<span>piano</span></div>
  </header>

  <!-- 본문 안내 카드 -->
  <main>
    <div class="card">
      <div class="badge">
        <span class="badge-dot"></span>
        <span>OPENING SOON</span>
      </div>

      <!-- 메인 메시지 -->
      <h1>
        아직 <span class="highlight">오픈 전</span>이에요!<br>
        곧 만나요!
      </h1>

      <p class="description">
        당신의 일상이 연주가 되는 특별한 공간을 준비하고 있습니다.<br>
        편안하고 감성적인 라운지로 곧 찾아뵐게요.
      </p>

      <!-- 미니 피아노 키보드 그래픽 -->
      <div class="piano-deco" aria-hidden="true">
        <div class="key-white"><div class="key-black"></div></div>
        <div class="key-white"><div class="key-black"></div></div>
        <div class="key-white"></div>
        <div class="key-white"><div class="key-black"></div></div>
        <div class="key-white"><div class="key-black"></div></div>
        <div class="key-white"><div class="key-black"></div></div>
        <div class="key-white"></div>
      </div>
    </div>
  </main>

  <!-- 푸터 -->
  <footer>
    <p>성인들을 위한 감성 음악 힐링 공간 | 위드피아노</p>
    <p>© withpiano. All rights reserved.</p>
  </footer>

</body>
</html>
